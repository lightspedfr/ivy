<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 240 320" width="240" height="320" preserveAspectRatio="xMidYMid slice">
<defs>
<filter id="sn-far" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation=".6"/></filter>
<filter id="sn-near" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="1.8"/></filter>
<linearGradient id="sn-frost" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e0f2fe" stop-opacity="0"/><stop offset="1" stop-color="#e0f2fe" stop-opacity=".28"/></linearGradient>
<g id="sn-flake" stroke="#f0f9ff" stroke-width="1.3" stroke-linecap="round" fill="none"><path id="sn-arm" d="M0 0 V-9 M0 -5 L-3 -8 M0 -5 L3 -8"/><use href="#sn-arm" transform="rotate(60)"/><use href="#sn-arm" transform="rotate(120)"/><use href="#sn-arm" transform="rotate(180)"/><use href="#sn-arm" transform="rotate(240)"/><use href="#sn-arm" transform="rotate(300)"/></g>
</defs>
<g fill="#e0f2fe" opacity=".55" filter="url(#sn-far)">
<circle r="1.1"><animateMotion dur="12s" repeatCount="indefinite" path="M20 -10 C 40 80, 0 160, 30 330"/></circle>
<circle r="1"><animateMotion dur="14s" begin="-4s" repeatCount="indefinite" path="M70 -10 C 50 80, 90 160, 60 330"/></circle>
<circle r="1.2"><animateMotion dur="11s" begin="-7s" repeatCount="indefinite" path="M130 -10 C 150 80, 110 160, 140 330"/></circle>
<circle r=".9"><animateMotion dur="13s" begin="-2s" repeatCount="indefinite" path="M180 -10 C 160 80, 200 160, 170 330"/></circle>
<circle r="1.1"><animateMotion dur="12.5s" begin="-9s" repeatCount="indefinite" path="M225 -10 C 240 80, 210 160, 230 330"/></circle>
<circle r="1"><animateMotion dur="15s" begin="-11s" repeatCount="indefinite" path="M100 -10 C 80 80, 120 160, 96 330"/></circle>
</g>
<g fill="#f8fafc" opacity=".85">
<circle r="2"><animateMotion dur="8s" repeatCount="indefinite" path="M40 -10 C 70 80, 20 170, 56 330"/></circle>
<circle r="1.6"><animateMotion dur="9s" begin="-3s" repeatCount="indefinite" path="M150 -10 C 120 90, 170 170, 140 330"/></circle>
<circle r="2.2"><animateMotion dur="7.5s" begin="-5.5s" repeatCount="indefinite" path="M210 -10 C 190 90, 230 170, 200 330"/></circle>
<circle r="1.8"><animateMotion dur="8.5s" begin="-1.5s" repeatCount="indefinite" path="M100 -10 C 130 80, 80 180, 110 330"/></circle>
</g>
<g>
<g><use href="#sn-flake"><animateTransform attributeName="transform" type="rotate" values="0;360" dur="9s" repeatCount="indefinite"/></use><animateMotion dur="10s" repeatCount="indefinite" path="M60 -20 C 100 60, 30 150, 80 230 S 60 300, 70 340"/></g>
<g><use href="#sn-flake" transform="scale(.7)"><animateTransform attributeName="transform" type="rotate" values="360;0" dur="7s" repeatCount="indefinite" additive="sum"/></use><animateMotion dur="12s" begin="-6s" repeatCount="indefinite" path="M190 -20 C 150 70, 220 150, 170 240 S 190 300, 180 340"/></g>
</g>
<g fill="#ffffff" opacity=".35" filter="url(#sn-near)">
<circle r="5"><animateMotion dur="5s" repeatCount="indefinite" path="M220 -20 C 180 100, 240 200, 200 340"/></circle>
<circle r="4"><animateMotion dur="6s" begin="-3s" repeatCount="indefinite" path="M14 -20 C 50 100, 0 200, 30 340"/></circle>
</g>
<rect y="260" width="240" height="60" fill="url(#sn-frost)"/>
</svg>
