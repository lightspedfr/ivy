<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 600 200" width="600" height="200" preserveAspectRatio="xMidYMid slice">
<defs>
<linearGradient id="pb-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#011a14"/><stop offset=".55" stop-color="#03382c"/><stop offset="1" stop-color="#0b4f3b"/></linearGradient>
<radialGradient id="pb-sun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fde68a" stop-opacity=".55"/><stop offset="1" stop-color="#fde68a" stop-opacity="0"/></radialGradient>
<linearGradient id="pb-gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fcd34d" stop-opacity="0"/><stop offset=".25" stop-color="#fcd34d"/><stop offset=".5" stop-color="#fff7d6"/><stop offset=".75" stop-color="#f5c451"/><stop offset="1" stop-color="#fcd34d" stop-opacity="0"/></linearGradient>
<linearGradient id="pb-mint" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6ee7b7" stop-opacity="0"/><stop offset=".5" stop-color="#6ee7b7"/><stop offset="1" stop-color="#6ee7b7" stop-opacity="0"/></linearGradient>
<linearGradient id="pb-sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset=".5" stop-color="#fff7d6" stop-opacity=".22"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
<linearGradient id="pb-leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff3c4"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
<linearGradient id="pb-leaf2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#bbf7d0"/><stop offset="1" stop-color="#059669"/></linearGradient>
<filter id="pb-glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<path id="pb-l" d="M0 -6 C 5 -5, 7 1, 0 6 C -7 1, -5 -5, 0 -6 Z"/>
</defs>
<rect width="600" height="200" fill="url(#pb-bg)"/>
<circle cx="470" cy="40" r="150" fill="url(#pb-sun)"><animate attributeName="r" values="140;165;140" dur="8s" repeatCount="indefinite"/></circle>
<g fill="none" stroke-linecap="round" filter="url(#pb-glow)">
<path d="M-20 140 C 80 90, 160 170, 260 120 S 440 60, 620 110" stroke="url(#pb-gold)" stroke-width="2.2" stroke-dasharray="60 30" opacity=".9"><animate attributeName="stroke-dashoffset" values="0;-180" dur="6s" repeatCount="indefinite"/></path>
<path d="M-20 165 C 100 125, 190 190, 300 150 S 470 100, 620 145" stroke="url(#pb-mint)" stroke-width="1.6" stroke-dasharray="40 24" opacity=".7"><animate attributeName="stroke-dashoffset" values="0;128" dur="7s" repeatCount="indefinite"/></path>
<path d="M-20 70 C 120 30, 200 100, 330 60 S 520 20, 620 50" stroke="url(#pb-gold)" stroke-width="1.2" stroke-dasharray="20 40" opacity=".5"><animate attributeName="stroke-dashoffset" values="0;-120" dur="9s" repeatCount="indefinite"/></path>
</g>
<g stroke="#10b981" stroke-width="2.4" fill="none" opacity=".85"><path d="M0 196 C 60 182, 110 198, 170 186 S 290 176, 350 190 S 480 200, 600 184"/></g>
<g fill="url(#pb-leaf2)"><use href="#pb-l" transform="translate(60 186) rotate(-40)"/><use href="#pb-l" transform="translate(140 192) rotate(30)"/><use href="#pb-l" transform="translate(230 182) rotate(-25)"/><use href="#pb-l" transform="translate(330 188) rotate(40)"/><use href="#pb-l" transform="translate(420 194) rotate(-35)"/><use href="#pb-l" transform="translate(520 188) rotate(25)"/></g>
<g>
<use href="#pb-l" fill="url(#pb-leaf)"><animateMotion dur="11s" repeatCount="indefinite" rotate="auto" path="M640 30 C 520 70, 470 20, 360 70 S 160 110, -40 80"/></use>
<use href="#pb-l" fill="url(#pb-leaf2)" transform="scale(.8)"><animateMotion dur="14s" begin="-5s" repeatCount="indefinite" rotate="auto" path="M640 110 C 520 80, 430 140, 320 100 S 120 60, -40 120"/></use>
<use href="#pb-l" fill="url(#pb-leaf)" transform="scale(1.2)"><animateMotion dur="13s" begin="-9s" repeatCount="indefinite" rotate="auto" path="M640 70 C 540 120, 420 60, 300 120 S 100 150, -40 40"/></use>
</g>
<g fill="#fff7d6">
<circle cx="90" cy="40" r="1.4"><animate attributeName="opacity" values="1;.2;1" dur="2.2s" repeatCount="indefinite"/></circle><circle cx="210" cy="28" r="1"/><circle cx="300" cy="44" r="1.6"><animate attributeName="opacity" values=".2;1;.2" dur="2.8s" repeatCount="indefinite"/></circle><circle cx="380" cy="18" r="1"/><circle cx="560" cy="90" r="1.3"><animate attributeName="opacity" values="1;.3;1" dur="3.2s" repeatCount="indefinite"/></circle><circle cx="30" cy="100" r="1"/><circle cx="160" cy="80" r=".9"><animate attributeName="opacity" values=".3;1;.3" dur="2.4s" repeatCount="indefinite"/></circle>
</g>
<rect x="-220" y="-40" width="160" height="300" fill="url(#pb-sheen)" transform="rotate(18 300 100)"><animate attributeName="x" values="-220;-220;760" keyTimes="0;.55;1" dur="7s" repeatCount="indefinite"/></rect>
</svg>
