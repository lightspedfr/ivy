<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 600 200" width="600" height="200" preserveAspectRatio="xMidYMid slice">
<defs>
<filter id="bnb-cloud" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.008 0.016" numOctaves="4" seed="21" result="n"><animate attributeName="baseFrequency" values="0.008 0.016;0.01 0.019;0.008 0.016" dur="20s" repeatCount="indefinite"/></feTurbulence><feColorMatrix in="n" type="matrix" values="1.4 0 0 0 -0.3  0 0.2 0 0 0  0.9 0.5 1.6 0 -0.4  0 0 0 2.4 -1.1"/></filter>
<radialGradient id="bnb-planet" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#fbcfe8"/><stop offset=".5" stop-color="#a855f7"/><stop offset="1" stop-color="#2e1065"/></radialGradient>
</defs>
<rect width="600" height="200" fill="#07041a"/>
<rect width="600" height="200" filter="url(#bnb-cloud)" opacity=".9"/>
<g fill="#ffffff">
<circle cx="60" cy="40" r="1.2"><animate attributeName="opacity" values="1;.2;1" dur="2.4s" repeatCount="indefinite"/></circle><circle cx="140" cy="150" r="1"/><circle cx="210" cy="30" r=".9"><animate attributeName="opacity" values=".2;1;.2" dur="3s" repeatCount="indefinite"/></circle><circle cx="330" cy="170" r="1.3"><animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/></circle><circle cx="400" cy="60" r=".8"/><circle cx="470" cy="140" r="1.1"><animate attributeName="opacity" values=".3;1;.3" dur="2.8s" repeatCount="indefinite"/></circle><circle cx="560" cy="40" r=".9"/><circle cx="30" cy="110" r=".8"/><circle cx="260" cy="110" r="1"/><circle cx="580" cy="170" r="1"><animate attributeName="opacity" values="1;.2;1" dur="3.4s" repeatCount="indefinite"/></circle>
</g>
<g transform="translate(470 96)"><circle r="30" fill="url(#bnb-planet)"/><ellipse rx="52" ry="10" fill="none" stroke="#f0abfc" stroke-width="2.4" opacity=".75" transform="rotate(-16)"/><animateTransform attributeName="transform" type="translate" values="470 96;470 88;470 96" dur="10s" repeatCount="indefinite"/></g>
