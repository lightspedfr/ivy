<circle cx="80" cy="80" r="55.5" fill="none" stroke="url(#ss-g)" stroke-width="6"/>
<circle cx="80" cy="80" r="55.5" fill="none" stroke="#fff4d6" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="54 295"><animate attributeName="stroke-dashoffset" values="0;-349" dur="4s" repeatCount="indefinite"/></circle>
