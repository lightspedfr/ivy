<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 240 320" width="240" height="320" preserveAspectRatio="xMidYMid slice">
<defs>
<radialGradient id="em-g" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff7d6"/><stop offset=".35" stop-color="#ffb02e"/><stop offset=".7" stop-color="#ff4d14" stop-opacity=".4"/><stop offset="1" stop-color="#ff4d14" stop-opacity="0"/></radialGradient>
<linearGradient id="em-heat" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff4d14" stop-opacity="0"/><stop offset=".7" stop-color="#ff6a1f" stop-opacity=".22"/><stop offset="1" stop-color="#ffb02e" stop-opacity=".45"/></linearGradient>
<filter id="em-haze" x="0" y="-20%" width="100%" height="140%"><feTurbulence type="fractalNoise" baseFrequency="0.02 0.06" numOctaves="2" seed="4" result="n"><animate attributeName="baseFrequency" values="0.02 0.06;0.03 0.09;0.02 0.06" dur="2.6s" repeatCount="indefinite"/></feTurbulence><feDisplacementMap in="SourceGraphic" in2="n" scale="22" xChannelSelector="R" yChannelSelector="G"/></filter>
<g id="em-spark"><circle r="6" fill="url(#em-g)"/></g>
</defs>
<rect y="190" width="240" height="140" fill="url(#em-heat)" filter="url(#em-haze)"><animate attributeName="opacity" values=".7;1;.8;1;.7" dur="1.8s" repeatCount="indefinite"/></rect>
<g>
