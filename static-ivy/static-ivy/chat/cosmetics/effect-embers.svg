<circle r=".8"><animateMotion dur="2.2s" begin="-1.6s" repeatCount="indefinite" path="M50 320 L 64 220"/><animate attributeName="opacity" values="1;0" dur="2.2s" begin="-1.6s" repeatCount="indefinite"/></circle>
