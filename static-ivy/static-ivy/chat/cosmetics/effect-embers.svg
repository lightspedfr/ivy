<g><use href="#em-spark" transform="scale(.8)"/><animateMotion dur="5.4s" begin="-2s" repeatCount="indefinite" path="M60 330 C 80 270, 40 220, 70 160 S 50 70, 66 -10"/><animate attributeName="opacity" values="1;.4;1;0" dur="5.4s" begin="-2s" repeatCount="indefinite"/></g>
<g><use href="#em-spark" transform="scale(.45)"/><animateMotion dur="3.2s" begin="-1.8s" repeatCount="indefinite" path="M226 330 C 210 270, 236 220, 216 160 S 230 80, 220 -10"/><animate attributeName="opacity" values="1;.4;1;0" dur="3.2s" begin="-1.8s" repeatCount="indefinite"/></g>
</g>
<g fill="#fff3c4">
<circle r="1"><animateMotion dur="2.4s" repeatCount="indefinite" path="M110 320 L 130 200"/><animate attributeName="opacity" values="1;0" dur="2.4s" repeatCount="indefinite"/></circle>
