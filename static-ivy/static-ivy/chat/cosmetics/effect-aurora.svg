<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 240 320" width="240" height="320" preserveAspectRatio="xMidYMid slice">
<defs>
<linearGradient id="au-a" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#34d399" stop-opacity="0"/><stop offset=".25" stop-color="#34d399"/><stop offset=".6" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/><animateTransform attributeName="gradientTransform" type="translate" values="-.3 0;.3 0;-.3 0" dur="10s" repeatCount="indefinite"/></linearGradient>
<linearGradient id="au-b" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f472b6" stop-opacity="0"/><stop offset=".4" stop-color="#c084fc"/><stop offset=".75" stop-color="#34d399"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/><animateTransform attributeName="gradientTransform" type="translate" values=".3 0;-.3 0;.3 0" dur="13s" repeatCount="indefinite"/></linearGradient>
<linearGradient id="au-fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#fff" stop-opacity=".6"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<mask id="au-mask"><rect width="240" height="320" fill="url(#au-fade)"/></mask>
<filter id="au-curtain" x="-20%" y="-30%" width="140%" height="160%"><feTurbulence type="fractalNoise" baseFrequency="0.09 0.006" numOctaves="2" seed="7" result="n"><animate attributeName="baseFrequency" values="0.09 0.006;0.12 0.008;0.09 0.006" dur="9s" repeatCount="indefinite"/></feTurbulence><feDisplacementMap in="SourceGraphic" in2="n" scale="30" xChannelSelector="R" yChannelSelector="G" result="d"/><feGaussianBlur in="d" stdDeviation="4"/></filter>
</defs>
<g mask="url(#au-mask)" filter="url(#au-curtain)" style="mix-blend-mode: screen">
<path fill="url(#au-a)" opacity=".75"><animate attributeName="d" dur="11s" repeatCount="indefinite" values="M-30 10 C 40 40, 120 -10, 270 30 L 270 150 C 180 110, 90 190, -30 140 Z;M-30 30 C 70 0, 160 50, 270 10 L 270 170 C 160 200, 60 120, -30 170 Z;M-30 10 C 40 40, 120 -10, 270 30 L 270 150 C 180 110, 90 190, -30 140 Z"/></path>
<path fill="url(#au-b)" opacity=".55"><animate attributeName="d" dur="15s" repeatCount="indefinite" values="M-30 60 C 60 30, 150 90, 270 50 L 270 120 C 160 150, 80 100, -30 130 Z;M-30 40 C 80 80, 140 20, 270 70 L 270 150 C 150 110, 70 160, -30 110 Z;M-30 60 C 60 30, 150 90, 270 50 L 270 120 C 160 150, 80 100, -30 130 Z"/></path>
</g>
<g fill="#ecfeff">
<circle cx="30" cy="22" r=".9"><animate attributeName="opacity" values="1;.2;1" dur="2.4s" repeatCount="indefinite"/></circle><circle cx="96" cy="12" r=".7"/><circle cx="170" cy="30" r="1"><animate attributeName="opacity" values=".3;1;.3" dur="3s" repeatCount="indefinite"/></circle><circle cx="214" cy="14" r=".8"/><circle cx="140" cy="70" r=".6"><animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/></circle>
</g>
<g fill="#a7f3d0" opacity=".7">
<circle r="1.2"><animateMotion dur="9s" repeatCount="indefinite" path="M40 150 C 60 110, 30 70, 50 20"/><animate attributeName="opacity" values="0;1;0" dur="9s" repeatCount="indefinite"/></circle>
<circle r="1"><animateMotion dur="11s" begin="-5s" repeatCount="indefinite" path="M190 160 C 170 120, 200 80, 180 20"/><animate attributeName="opacity" values="0;1;0" dur="11s" begin="-5s" repeatCount="indefinite"/></circle>
</g>
</svg>
