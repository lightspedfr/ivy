<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 240 320" width="240" height="320" preserveAspectRatio="xMidYMid slice">
<defs>
<filter id="ls-glow" x="-50%" y="-20%" width="200%" height="140%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="ls-crackle" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="turbulence" baseFrequency="0.08" numOctaves="1" seed="2" result="n"><animate attributeName="seed" values="2;6;11;3;8" dur=".5s" repeatCount="indefinite" calcMode="discrete"/></feTurbulence><feDisplacementMap in="SourceGraphic" in2="n" scale="5"/></filter>
<linearGradient id="ls-cloud" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#312e81" stop-opacity=".55"/><stop offset="1" stop-color="#312e81" stop-opacity="0"/></linearGradient>
</defs>
<rect width="240" height="110" fill="url(#ls-cloud)"><animate attributeName="opacity" values=".6;.6;1;.6;.6" keyTimes="0;.3;.33;.4;1" dur="4.2s" repeatCount="indefinite"/></rect>
<rect width="240" height="320" fill="#c7d2fe"><animate attributeName="opacity" values="0;0;.28;0;.16;0;0" keyTimes="0;.3;.32;.35;.37;.42;1" dur="4.2s" repeatCount="indefinite"/></rect>
<g filter="url(#ls-glow)" fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M150 -4 L136 54 L156 60 L126 132 L146 138 L110 230" stroke="#e0e7ff" stroke-width="2.6" stroke-dasharray="300" stroke-dashoffset="300"><animate attributeName="stroke-dashoffset" values="300;300;0;0" keyTimes="0;.3;.34;1" dur="4.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;.2;1;0;0" keyTimes="0;.3;.32;.35;.37;.45;1" dur="4.2s" repeatCount="indefinite"/></path>
<path d="M136 54 L112 84 L118 104 M126 132 L160 168 L154 190" stroke="#a5b4fc" stroke-width="1.4" stroke-dasharray="120" stroke-dashoffset="120"><animate attributeName="stroke-dashoffset" values="120;120;0;0" keyTimes="0;.32;.36;1" dur="4.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;.32;.35;.45;1" dur="4.2s" repeatCount="indefinite"/></path>
<path d="M40 -4 L56 40 L38 46 L64 104" stroke="#c4b5fd" stroke-width="1.8" stroke-dasharray="140" stroke-dashoffset="140"><animate attributeName="stroke-dashoffset" values="140;140;0;0" keyTimes="0;.78;.81;1" dur="4.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;.78;.8;.88;1" dur="4.2s" repeatCount="indefinite"/></path>
</g>
<g filter="url(#ls-crackle)">
<rect x="3" y="3" width="234" height="314" rx="18" fill="none" stroke="#818cf8" stroke-width="1.6" stroke-dasharray="40 260" opacity=".9"><animate attributeName="stroke-dashoffset" values="0;-1096" dur="3s" repeatCount="indefinite"/></rect>
<rect x="3" y="3" width="234" height="314" rx="18" fill="none" stroke="#22d3ee" stroke-width="1.2" stroke-dasharray="26 248" opacity=".8"><animate attributeName="stroke-dashoffset" values="-548;-1644" dur="3s" repeatCount="indefinite"/></rect>
</g>
<g fill="#e0e7ff">
<circle r="1.4"><animateMotion dur="2s" repeatCount="indefinite" path="M110 230 C 90 250, 70 240, 60 270"/><animate attributeName="opacity" values="0;0;1;0" keyTimes="0;.15;.2;1" dur="2s" repeatCount="indefinite"/></circle>
<circle r="1.2"><animateMotion dur="2s" begin="-.4s" repeatCount="indefinite" path="M110 230 C 130 250, 150 244, 162 274"/><animate attributeName="opacity" values="0;0;1;0" keyTimes="0;.15;.2;1" dur="2s" begin="-.4s" repeatCount="indefinite"/></circle>
