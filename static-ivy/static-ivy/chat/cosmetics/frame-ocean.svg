<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 160 160" width="160" height="160">
<defs>
<linearGradient id="oc-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#bae6fd"/><stop offset=".5" stop-color="#0ea5e9"/><stop offset="1" stop-color="#1e40af"/><animateTransform attributeName="gradientTransform" type="rotate" values="0 .5 .5;-360 .5 .5" dur="8s" repeatCount="indefinite"/></linearGradient>
<radialGradient id="oc-b" cx=".35" cy=".3" r=".7"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#bae6fd" stop-opacity=".7"/><stop offset="1" stop-color="#38bdf8" stop-opacity=".25"/></radialGradient>
<filter id="oc-wave" x="-30%" y="-30%" width="160%" height="160%"><feTurbulence type="turbulence" baseFrequency="0.045" numOctaves="2" seed="7" result="n"><animate attributeName="baseFrequency" values="0.04;0.06;0.04" dur="5s" repeatCount="indefinite"/></feTurbulence><feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="B" result="d"/><feGaussianBlur in="d" stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="d"/></feMerge></filter>
</defs>
<g filter="url(#oc-wave)">
<circle cx="80" cy="80" r="56" fill="none" stroke="url(#oc-g)" stroke-width="8"/>
<circle cx="80" cy="80" r="56" fill="none" stroke="#e0f7ff" stroke-width="2" stroke-linecap="round" stroke-dasharray="26 50 12 64"><animate attributeName="stroke-dashoffset" values="0;352" dur="6s" repeatCount="indefinite"/></circle>
</g>
<circle cx="80" cy="80" r="66" fill="none" stroke="#7dd3fc" stroke-width="1.2" stroke-dasharray="2 7" opacity=".55"><animateTransform attributeName="transform" type="rotate" values="0 80 80;360 80 80" dur="30s" repeatCount="indefinite"/></circle>
<circle r="3.2" fill="url(#oc-b)"><animateMotion dur="3.6s" repeatCount="indefinite" path="M128 118 C 136 98, 128 80, 138 58"/><animate attributeName="opacity" values="0;1;1;0" dur="3.6s" repeatCount="indefinite"/></circle>
<circle r="2.2" fill="url(#oc-b)"><animateMotion dur="4.4s" begin="-1.6s" repeatCount="indefinite" path="M34 120 C 24 100, 34 84, 22 62"/><animate attributeName="opacity" values="0;1;1;0" dur="4.4s" begin="-1.6s" repeatCount="indefinite"/></circle>
