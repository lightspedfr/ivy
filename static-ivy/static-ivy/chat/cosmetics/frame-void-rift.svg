<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 160 160" width="160" height="160">
<defs>
<filter id="vr-swirl" x="-40%" y="-40%" width="180%" height="180%"><feTurbulence type="turbulence" baseFrequency="0.06" numOctaves="2" seed="8" result="n"><animate attributeName="baseFrequency" values="0.05;0.08;0.05" dur="3s" repeatCount="indefinite"/></feTurbulence><feDisplacementMap in="SourceGraphic" in2="n" scale="8" xChannelSelector="R" yChannelSelector="G" result="d"/><feGaussianBlur in="d" stdDeviation="1.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="d"/></feMerge></filter>
<filter id="vr-glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<radialGradient id="vr-halo" cx=".5" cy=".5" r=".5"><stop offset=".62" stop-color="#7c3aed" stop-opacity="0"/><stop offset=".78" stop-color="#7c3aed" stop-opacity=".55"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
</defs>
<circle cx="80" cy="80" r="76" fill="url(#vr-halo)"><animate attributeName="opacity" values=".6;1;.6" dur="2.6s" repeatCount="indefinite"/></circle>
<circle cx="80" cy="80" r="56" fill="none" stroke="#0a0014" stroke-width="10"/>
<g filter="url(#vr-swirl)" fill="none" stroke-linecap="round">
<circle cx="80" cy="80" r="56" stroke="#a855f7" stroke-width="3.4" stroke-dasharray="70 40 30 212"><animateTransform attributeName="transform" type="rotate" values="0 80 80;360 80 80" dur="2.2s" repeatCount="indefinite"/></circle>
<circle cx="80" cy="80" r="56" stroke="#e879f9" stroke-width="2.4" stroke-dasharray="50 90 20 192"><animateTransform attributeName="transform" type="rotate" values="120 80 80;480 80 80" dur="3.4s" repeatCount="indefinite"/></circle>
<circle cx="80" cy="80" r="60" stroke="#6d28d9" stroke-width="2" stroke-dasharray="30 60"><animateTransform attributeName="transform" type="rotate" values="360 80 80;0 80 80" dur="5s" repeatCount="indefinite"/></circle>
</g>
<g fill="#f5e9ff" filter="url(#vr-glow)">
<circle r="2.2"><animateMotion dur="2.6s" repeatCount="indefinite" path="M152 80 C 152 30, 100 8, 70 18 C 50 24, 40 40, 38 56"/><animate attributeName="r" values="2.4;.4" dur="2.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="2.6s" repeatCount="indefinite"/></circle>
<circle r="1.8"><animateMotion dur="3.2s" begin="-1.1s" repeatCount="indefinite" path="M8 80 C 8 130, 60 152, 90 142 C 110 136, 120 120, 122 104"/><animate attributeName="r" values="2;.4" dur="3.2s" begin="-1.1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="3.2s" begin="-1.1s" repeatCount="indefinite"/></circle>
<circle r="1.6"><animateMotion dur="2.9s" begin="-2s" repeatCount="indefinite" path="M80 4 C 130 4, 154 50, 144 90 C 138 110, 124 120, 108 124"/><animate attributeName="r" values="1.8;.3" dur="2.9s" begin="-2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="2.9s" begin="-2s" repeatCount="indefinite"/></circle>
</g>
</svg>
