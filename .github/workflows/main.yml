name: Decompress tar.gz and Commit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decompress-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clean and Decompress tar.gz file
        run: |
          # Completely remove the old folder and its remnants
          rm -rf static-ivy
          mkdir static-ivy
          
          # Extract into the freshly created empty folder
          # Replace 'archive.tar.gz' with your actual archive name
          tar -xzf static-ivy-proxied.tar.gz -C static-ivy

      - name: Configure Git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"

      - name: Commit and push changes
        run: |
          # git add . will automatically track deletions of removed old files
          git add .
          git status
          git diff --staged --quiet || git commit -m "Overwrite static-ivy folder with new extraction"
          git push
