name: Decompress tar.gz and Commit

on:
  workflow_dispatch:

# This grants write permissions to the repository's contents
permissions:
  contents: write

jobs:
  decompress-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Decompress tar.gz file
        run: |
          tar -xzf static-ivy-updated.tar.gz -C .

      - name: Configure Git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push changes
        run: |
          git add .
          git status
          git diff --staged --quiet || git commit -m "Decompress static-ivy-updated.tar.gz and update repository contents"
          git push
